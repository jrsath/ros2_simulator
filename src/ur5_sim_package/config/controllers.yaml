controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    command_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity

    # gz_ros2_control in ROS 2 Humble selects effort mode as soon as an effort
    # command interface is present in the URDF. Use the trajectory controller's
    # supported effort PID adapter so position trajectories still work while
    # retaining the official UR position, velocity, and effort interfaces.
    gains:
      shoulder_pan_joint:  {p: 30.0, i: 0.0, d: 4.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      shoulder_lift_joint: {p: 60.0, i: 0.0, d: 8.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      elbow_joint:         {p: 50.0, i: 0.0, d: 6.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      wrist_1_joint:       {p: 10.0, i: 0.0, d: 1.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      wrist_2_joint:       {p: 10.0, i: 0.0, d: 1.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      wrist_3_joint:       {p: 5.0,  i: 0.0, d: 0.5, i_clamp: 0.0, ff_velocity_scale: 0.0}

    state_publish_rate: 50.0
    action_monitor_rate: 20.0


gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0
