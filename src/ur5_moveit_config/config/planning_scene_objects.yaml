# Pose format: [x, y, z, roll, pitch, yaw].
frame_id: world
objects:
  # Ground collision object.
  - id: ground
    enabled: true
    shape: box
    dimensions: [4.0, 4.0, 0.02]
    pose: [0.0, 0.0, -0.015, 0.0, 0.0, 0.0]

  # Part F pedestal.
  - id: pedestal_block
    enabled: true
    shape: box
    dimensions: [0.20, 0.20, 0.80]
    pose: [0.50, 0.0, 0.40, 0.0, 0.0, 0.0]

  # Car geometry matches the Gazebo model.
  - id: two_wheel_car
    enabled: true
    parts:
      - shape: box
        dimensions: [0.10, 0.05, 0.025]
        pose: [0.224, 0.0, 0.02, 0.0, 0.0, 0.0]
      - shape: cylinder
        dimensions: [0.01, 0.02]
        pose: [0.199, 0.03, 0.02, -1.5707, 0.0, 0.0]
      - shape: cylinder
        dimensions: [0.01, 0.02]
        pose: [0.199, -0.03, 0.02, -1.5707, 0.0, 0.0]
      - shape: sphere
        dimensions: [0.01]
        pose: [0.264, 0.0, 0.01, 0.0, 0.0, 0.0]
